name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race

      - name: Vet
        run: go vet ./...

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      # macstash's central claim is that its own code never opens a socket.
      # This is the check that keeps that true.
      - name: No socket-capable imports
        run: ./scripts/check-imports.sh

      # The never list lives in Go so a catalog change cannot reach around it.
      # These tests are the enforcement.
      - name: Catalog and classification invariants
        run: |
          go test ./internal/catalog/ -run 'Catalog|Never|Schema|Scrub' -v
          go test ./internal/classify/ -v

      # A tool that reads every credential store on a machine should not be
      # running a dependency with a known advisory. There is one dependency, so
      # this costs seconds.
      #
      # Pinned, not @latest. An unpinned `go install` resolves and executes
      # whatever was published most recently, on every run, which makes the
      # supply-chain check its own supply-chain risk. Bump this deliberately.
      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
