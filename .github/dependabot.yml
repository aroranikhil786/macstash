# Dependabot keeps two things current: the one Go dependency, and the pinned
# versions in CI.
#
# The Actions ecosystem is the more valuable of the two here. Workflow steps are
# pinned by tag, and a tag is mutable — whoever controls the action can move v4
# to point at anything. Dependabot bumping them deliberately is what makes that
# pinning meaningful rather than decorative.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
