id: vscode
name: Visual Studio Code
category: editor
detect:
  app: /Applications/Visual Studio Code.app
  brew_cask: visual-studio-code
capture:
  paths:
    - path: ~/Library/Application Support/Code/User/settings.json
      class: public
    - path: ~/Library/Application Support/Code/User/keybindings.json
      class: public
    - path: ~/Library/Application Support/Code/User/snippets
      class: public
restore:
  note: |
    Extensions are captured as a list of ids and reinstalled during restore with
    `code --install-extension`. Both ends need the `code` command on PATH: if it
    was missing at capture the list is empty, and if it is missing here the ids
    are printed for you to install by hand. Add it from the command palette,
    "Shell Command: Install 'code' command in PATH".
    Saved credentials live in globalStorage, which is never captured.
