id: ohmyzsh
name: Oh My Zsh
category: shell
detect:
  path: ~/.oh-my-zsh
capture:
  paths:
    # Only the custom directory. The framework itself is thousands of files that
    # the installer restores in seconds, and a stale copy of it is worse than a
    # fresh one.
    - path: ~/.oh-my-zsh/custom
      class: public
      skip:
        - "*/.git"
        # Oh My Zsh ships these two stubs inside custom/. The pattern used to be
        # "example.zsh", which matches neither of their real names, so both were
        # carried in every bundle and written back over the identical copies a
        # fresh install had just put there.
        - example.zsh-theme
        - example.plugin.zsh
restore:
  note: |
    Oh My Zsh itself is not captured. Reinstall it first, with the flag:

      sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --keep-zshrc

    Without --keep-zshrc the installer replaces the .zshrc this restore just
    put back. Then these custom themes and plugins drop into ~/.oh-my-zsh/custom.
    Anything under custom/ that is a git clone — powerlevel10k, most plugins —
    is skipped rather than copied, and the capture report names it along with
    the command to clone it back. A detached copy of a theme is worse than a
    current one, and it is the same reasoning that keeps the framework out.
