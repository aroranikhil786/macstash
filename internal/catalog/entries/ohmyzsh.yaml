id: ohmyzsh
name: Oh My Zsh
category: shell
detect:
  path: ~/.oh-my-zsh
capture:
  paths:
    # Only the custom directory. The framework itself is thousands of files that
    # the installer restores in seconds, and a stale copy of it is worse than a
    # fresh one.
    - path: ~/.oh-my-zsh/custom
      class: public
      skip:
        - "*/.git"
        - example.zsh
restore:
  note: |
    Oh My Zsh itself is not captured — reinstall it from ohmyz.sh first, then
    these custom themes and plugins drop back into ~/.oh-my-zsh/custom.
    Anything under custom/ that is a git clone — powerlevel10k, most plugins —
    is skipped rather than copied, and the capture report names it along with
    the command to clone it back. A detached copy of a theme is worse than a
    current one, and it is the same reasoning that keeps the framework out.
